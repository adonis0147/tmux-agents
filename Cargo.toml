[package]
name = "tmux-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "2"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["sink"] }
libc = "0.2.191"
pty-process = { version = "0.5.4", features = ["async"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
