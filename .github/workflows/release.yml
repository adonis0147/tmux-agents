name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: stable
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target "${TARGET}"
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install Zig build tools
        if: runner.os == 'Linux'
        run: python3 -m pip install cargo-zigbuild==0.24.1 ziglang==0.15.2
      - name: Test
        run: |
          cargo test --locked
          python3 tests/installer.py -v
      - name: Build Linux with Zig and musl
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target "${TARGET}"
      - name: Build macOS
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target "${TARGET}"
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          asset="tmux-agents-${GITHUB_REF_NAME}-${TARGET}"
          cp "target/${TARGET}/release/tmux-agents" "dist/${asset}"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for binary in sorted(Path("dist").iterdir()):
              digest = hashlib.sha256(binary.read_bytes()).hexdigest()
              binary.with_name(binary.name + ".sha256").write_text(f"{digest}  {binary.name}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
