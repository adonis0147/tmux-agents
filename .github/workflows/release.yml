name: Release

on:
  push:
    tags:
      - 'v*'
      - 'pre-*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: x86_64-apple-darwin
            macos_deployment_target: '10.12'
          - runner: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: '11.0'
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: stable
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          IFS= read -r tag < RELEASE_TAG
          test "${GITHUB_REF_NAME}" = "${tag}"
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target "${TARGET}"
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install Zig build tools
        if: runner.os == 'Linux'
        run: python3 -m pip install cargo-zigbuild==0.24.1 ziglang==0.15.2
      - name: Test
        run: |
          cargo test --locked
          python3 tests/installer.py -v
      - name: Build Linux with Zig and musl
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target "${TARGET}"
      - name: Build and verify macOS deployment target
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          cargo build --release --locked --target "${TARGET}"
          minimum=$(otool -l "target/${TARGET}/release/tmux-agents" | awk '
            $1 == "cmd" { command = $2 }
            command == "LC_BUILD_VERSION" && $1 == "minos" { print $2; exit }
            command == "LC_VERSION_MIN_MACOSX" && $1 == "version" { print $2; exit }
          ')
          test "${minimum}" = "${MACOSX_DEPLOYMENT_TARGET}"
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          asset="tmux-agents-${GITHUB_REF_NAME}-${TARGET}"
          cp "target/${TARGET}/release/tmux-agents" "dist/${asset}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          binaries = sorted(Path("dist").iterdir())
          with Path("dist/SHA256SUMS").open("w") as manifest:
              for binary in binaries:
                  digest = hashlib.sha256(binary.read_bytes()).hexdigest()
                  manifest.write(f"{digest}  {binary.name}\n")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--verify-tag --title "${GITHUB_REF_NAME}" --generate-notes)
          case "${GITHUB_REF_NAME}" in
            pre-*|v*-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}"
